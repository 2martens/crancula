# Packages Crancula for Windows, macOS and Linux and publishes a draft GitHub Release (#11).
# A pushed tag `v*` builds and publishes. A manual run, or a pull request that changes the packaging
# setup, only builds and keeps the artifacts.
# macOS is signed with Developer ID and notarized, and a Mac App Store package is built (ADR 30,
# documentation/MACOS-SIGNING.md). Without the signing secrets, a pull request or manual run builds
# unsigned and skips the App Store package; a tag fails. Windows and Linux are not code-signed.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - electron-builder.json
      - build/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Translations
        run: npm run i18n:check
      - name: Test
        run: npm run test

  build:
    name: Package (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Package
        if: runner.os != 'macOS'
        run: npm run electron:build
        env:
          # Unsigned builds: don't look for a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package, signed and notarized
        if: runner.os == 'macOS'
        shell: bash
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # Developer ID Application certificate with its private key (.p12, base64).
          CSC_LINK: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          # App Store Connect API key for notarization.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            if [ "$IS_TAG" = 'true' ]; then
              echo "::error::A release needs the macOS signing secrets (documentation/MACOS-SIGNING.md)."
              exit 1
            fi
            echo "::warning::macOS signing secrets missing: building an unsigned .dmg."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          fi
          unset APPLE_API_KEY_P8
          npm run electron:build
      # Targets from electron-builder.json: portable .exe, .dmg, .AppImage.
      - uses: actions/upload-artifact@v7
        with:
          name: crancula-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  app-store:
    name: Package (Mac App Store)
    needs: check
    runs-on: macos-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Apple Distribution certificate (signs the app) and Mac Installer Distribution certificate
      # (signs the .pkg), each a .p12 with its private key, base64.
      CSC_LINK: ${{ secrets.MAS_APP_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAS_APP_P12_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.MAS_INSTALLER_P12_BASE64 }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_INSTALLER_P12_PASSWORD }}
      MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the App Store secrets
        id: secrets
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_INSTALLER_LINK" ] && [ -n "$MAS_PROVISIONING_PROFILE_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_TAG" = 'true' ]; then
            echo "::error::A release needs the Mac App Store secrets (documentation/MACOS-SIGNING.md)."
            exit 1
          else
            echo "::warning::Mac App Store secrets missing: skipping the App Store package."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.present == 'true'
      - name: Package
        if: steps.secrets.outputs.present == 'true'
        shell: bash
        run: |
          case "$APPLE_TEAM_ID" in
            *[!A-Z0-9]*|'') echo "::error::APPLE_TEAM_ID must be the 10-character Team ID."; exit 1 ;;
          esac
          printf '%s' "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > build/embedded.provisionprofile
          sed -i '' "s/TEAM_ID\./$APPLE_TEAM_ID./" build/entitlements.mas.plist
          npm run web:prod
          npx electron-builder build --mac mas --publish=never "-c.mas.extendInfo.ElectronTeamID=$APPLE_TEAM_ID"
      # Not attached to the GitHub Release: upload it to App Store Connect with Transporter.
      - uses: actions/upload-artifact@v7
        if: steps.secrets.outputs.present == 'true'
        with:
          name: app-store-package
          path: release/**/*.pkg
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: [build, app-store]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: crancula-*
          merge-multiple: true
      # Release notes: the version's section of CHANGELOG.md (release skill), plus the install note.
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          cat >> notes.md <<'NOTE'

          ### Install
          Windows: portable `.exe`. macOS: `.dmg` (Apple silicon). Linux: `.AppImage`.
          The macOS build is signed and notarized. The Windows and Linux builds are not code-signed:
          Windows SmartScreen asks for confirmation (*More info → Run anyway*).
          NOTE
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --draft --verify-tag --title "$TAG" --notes-file notes.md
